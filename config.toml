[Messenger-DeVanced]
app-name = "Messenger"
patches-source = "RookieEnough/De-Vanced"
cli-source = "MorpheApp/morphe-cli"
rv-brand = "De-Vanced"
build-mode = "both"
include-stock = "auto"
clone = true
# orca patches impose no version ceiling, so 'auto' falls back to the latest downloadable build.
version = "auto"
arch = "arm64-v8a"
# fingerprint gone from Messenger 563.x; drop once De-Vanced re-fingerprints it.
excluded-patches = "'Hide inbox ads'"
archive-dlurl = "https://archive.org/download/andrews-apks/apks/com.facebook.orca"
apkmirror-dlurl = "https://www.apkmirror.com/apk/facebook-2/messenger/"

[Threads-Chiggi]
app-name = "Threads"
patches-source = "durgesh0505/chiggi_morphe_patches"
cli-source = "MorpheApp/morphe-cli"
rv-brand = "Chiggi"
build-mode = "both"
include-stock = "auto"
clone = true
version = "auto"
arch = "arm64-v8a"
# both renames are default-ON here; 'Change package name' must stay out of excluded-patches
# (collides with clone's apk-mode -e), so the module disables it on its own.
excluded-patches = "'Change app name'"
module-excluded-patches = "'Change package name'"
# archive is the only source serving 434.0.0.41.74 (apkmirror 403s; uptodown buries it).
archive-dlurl = "https://archive.org/download/andrews-apks/apks/com.instagram.barcelona"
apkmirror-dlurl = "https://www.apkmirror.com/apk/meta-platforms-inc/threads-instagram/"
uptodown-dlurl = "https://threads.en.uptodown.com/android"

