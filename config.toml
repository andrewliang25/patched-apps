[Facebook-DeVanced]
app-name = "Facebook"
patches-source = "RookieEnough/De-Vanced"
cli-source = "MorpheApp/morphe-cli"
rv-brand = "De-Vanced"
build-mode = "both"
include-stock = "auto"
clone = true
version = "auto"
arch = "arm64-v8a"
archive-dlurl = "https://archive.org/download/andrews-apks/apks/com.facebook.katana"
uptodown-dlurl = "https://facebook.en.uptodown.com/android"

[Messenger-DeVanced]
app-name = "Messenger"
patches-source = "RookieEnough/De-Vanced"
cli-source = "MorpheApp/morphe-cli"
rv-brand = "De-Vanced"
build-mode = "both"
include-stock = "auto"
clone = true
# The orca patches set no version limit, so 'auto' falls back to the latest downloadable build.
version = "auto"
arch = "arm64-v8a"
# The fingerprint is gone from Messenger 563.x. Remove this line after De-Vanced fixes the patch.
excluded-patches = "'Hide inbox ads'"
archive-dlurl = "https://archive.org/download/andrews-apks/apks/com.facebook.orca"
apkmirror-dlurl = "https://www.apkmirror.com/apk/facebook-2/messenger/"

[Threads-Chiggi]
app-name = "Threads"
patches-source = "durgesh0505/chiggi_morphe_patches"
cli-source = "MorpheApp/morphe-cli"
rv-brand = "Chiggi"
build-mode = "both"
include-stock = "auto"
clone = true
version = "auto"
arch = "arm64-v8a"
# Both rename patches are on by default here. 'Change package name' must stay out of
# excluded-patches, because it collides with the apk-mode -e of clone. Thus the module
# turns it off separately.
excluded-patches = "'Change app name'"
module-excluded-patches = "'Change package name'"
# archive is the only source that serves 434.0.0.41.74. apkmirror returns 403 and uptodown hides it.
archive-dlurl = "https://archive.org/download/andrews-apks/apks/com.instagram.barcelona"
apkmirror-dlurl = "https://www.apkmirror.com/apk/meta-platforms-inc/threads-instagram/"
uptodown-dlurl = "https://threads.en.uptodown.com/android"

[Photos-DeVanced]
app-name = "Photos"
patches-source = "RookieEnough/De-Vanced"
cli-source = "MorpheApp/morphe-cli"
rv-brand = "De-Vanced"
build-mode = "both"
include-stock = "auto"
clone = true
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/photos/"
uptodown-dlurl = "https://google-photos.en.uptodown.com/android"
archive-dlurl = "https://archive.org/download/andrews-apks/apks/com.google.android.apps.photos"

["Twitter/X-Piko"]
app-name = "Twitter"
patches-source = "crimera/piko"
cli-source = "MorpheApp/morphe-cli"
rv-brand = "Piko"
build-mode = "both"
include-stock = "auto"
version = "auto"
apkmirror-dlurl = "https://www.apkmirror.com/apk/x-corp/twitter/"
archive-dlurl = "https://archive.org/download/andrews-apks/apks/com.twitter.android"

[Instagram-Piko]
app-name = "Instagram"
patches-source = "crimera/piko"
cli-source = "MorpheApp/morphe-cli"
rv-brand = "Piko"
build-mode = "apk"
clone = true
version = "auto"
arch = "all"
# The ghost-mode patches. InboxActionBarBuilderFingerprint broke in Piko 3.8.0 and stops the
# run. Exclude only these patches, and not with --continue-on-error, so that other broken
# patches still fail loudly.
excluded-patches = "'Disable typing status' 'View DMs anonymously' 'View live anonymously' 'View stories anonymously'"
archive-dlurl = "https://archive.org/download/andrews-apks/apks/com.instagram.android"
apkmirror-dlurl = "https://www.apkmirror.com/apk/instagram/instagram-instagram/"
uptodown-dlurl = "https://instagram.en.uptodown.com/android"

[Telegram-Rushi]
app-name = "Telegram"
patches-source = "rushiranpise/morphe-patches"
cli-source = "MorpheApp/morphe-cli"
rv-brand = "Rushi"
build-mode = "both"
# The Play Store package. There is no 'clone', because the bundle has no rename patch for it.
# Thus the non-root apk replaces the official install instead of installing beside it.
include-stock = "auto"
# The mirrored build is the arm64 and 480dpi variant of 12.10.0 (code 70242). The fingerprints
# of the bundle target this build. The universal 12.10.0 upload is a later re-release.
arch = "arm64-v8a"
dpi = "480dpi"
# There is no uptodown source. Its 'telegram' slug is the org.telegram.messenger.web build.
archive-dlurl = "https://archive.org/download/andrews-apks/apks/org.telegram.messenger"
apkmirror-dlurl = "https://www.apkmirror.com/apk/telegram-fz-llc/telegram/"

[LINE-Andrew]
app-name = "LINE"
patches-source = "andrewliang25/morphe-patches"
cli-source = "MorpheApp/morphe-cli"
rv-brand = "Andrew"
build-mode = "both"
# archive hosts an arm64-only apkm, because apkmirror returns 403 for the split bundle of LINE.
# There is no 'clone', because the bundle has no rename patch and LINE depends on its package.
version = "auto"
arch = "arm64-v8a"
# This keeps the original split signature of LINE, which its server-side integrity checks need.
include-stock = "auto"
# Only the re-signed apk needs the push-notification fix. The module must not have it.
apk-included-patches = "'Fix push notifications'"
module-excluded-patches = "'Fix push notifications'"
archive-dlurl = "https://archive.org/download/andrews-apks/apks/jp.naver.line.android"
apkmirror-dlurl = "https://www.apkmirror.com/apk/line-corporation/line"
uptodown-dlurl = "https://line.en.uptodown.com/android"
