[Instagram-Piko]
app-name = "Instagram"
patches-source = "crimera/piko"
cli-source = "MorpheApp/morphe-cli"
rv-brand = "Piko"
build-mode = "apk"
clone = true
version = "auto"
arch = "all"
# Piko 3.8.0 broke InboxActionBarButtonPatch (InboxActionBarBuilderFingerprint) on its OWN
# supported build (435.0.0.37.76 — every 3.8.0 patch is version-locked to it, which is what
# 'auto' resolves to): the four patches that depend on it hard-fail and abort the whole run.
# Exclude exactly those four surgically (not --continue-on-error) so any *other* patch break
# still fails loudly. All four are the "ghost mode" anonymous-view / hide-typing features. Verified
# locally: with these excluded, 48/48 remaining patches apply cleanly. Drop them once Piko
# re-fingerprints (or bumps its supported Instagram past 435).
excluded-patches = "'Disable typing status' 'View DMs anonymously' 'View live anonymously' 'View stories anonymously'"
archive-dlurl = "https://archive.org/download/andrews-apks/apks/com.instagram.android"
apkmirror-dlurl = "https://www.apkmirror.com/apk/instagram/instagram-instagram/"
uptodown-dlurl = "https://instagram.en.uptodown.com/android"

[LINE-Andrew]
app-name = "LINE"
patches-source = "andrewliang25/morphe-patches"
cli-source = "MorpheApp/morphe-cli"
rv-brand = "Andrew"
build-mode = "both"
# 'auto' resolves to the patches' only supported build (26.11.0). LINE is self-hosted on
# archive.org as the primary source (archive precedes apkmirror/uptodown in DL_SRCS) because
# apkmirror serves it only as an arch-split bundle that 403s from CI; apkmirror/uptodown are
# kept below as fallbacks. The uploaded apkm is arm64-v8a only (single-arch), so arch is
# pinned; no arm-v7a stock exists.
# No 'clone' — the bundle ships no rename patch for LINE, and its identity is tied to the pkg.
version = "auto"
arch = "arm64-v8a"
# keep LINE's genuine signature in the module: 'auto' -> installs the original LINE-signed
# splits (no APKEditor merge/re-sign), which matters for LINE's server-side integrity checks.
include-stock = "auto"
# Per-mode patch divergence from this single 'both' table: the non-root apk gets the push-
# notification fix; the root module excludes it. Names target morphe-patches v1.4.0, where
# 'Fix push notifications' is default-ON -- so module-excluded-patches is the load-bearing key
# that removes it from the module, and apk-included-patches is redundant (default-on) but kept
# to pin intent and survive a future default flip. MERGE ONLY AFTER v1.4.0 is the latest stable
# release: until then 'latest' is v1.3.0, where this patch has a different name ('Fix push
# notifications when app is closed'), and these keys would not match it.
apk-included-patches = "'Fix push notifications'"
module-excluded-patches = "'Fix push notifications'"
archive-dlurl = "https://archive.org/download/andrews-apks/apks/jp.naver.line.android"
apkmirror-dlurl = "https://www.apkmirror.com/apk/line-corporation/line"
uptodown-dlurl = "https://line.en.uptodown.com/android"
