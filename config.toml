[LINE-Andrew]
app-name = "LINE"
patches-source = "andrewliang25/morphe-patches"
cli-source = "MorpheApp/morphe-cli"
rv-brand = "Andrew"
build-mode = "both"
# archive hosts an arm64-only apkm (apkmirror 403s LINE's split bundle). No 'clone' — the
# bundle ships no rename patch and LINE's identity is tied to its package.
version = "auto"
arch = "arm64-v8a"
# keeps LINE's genuine split signature, which its server-side integrity checks require.
include-stock = "auto"
# the push-notification fix is only needed by the re-signed apk; the module must not have it.
apk-included-patches = "'Fix push notifications'"
module-excluded-patches = "'Fix push notifications'"
archive-dlurl = "https://archive.org/download/andrews-apks/apks/jp.naver.line.android"
apkmirror-dlurl = "https://www.apkmirror.com/apk/line-corporation/line"
uptodown-dlurl = "https://line.en.uptodown.com/android"
